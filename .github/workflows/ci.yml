
name: Java CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode clean verify

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-app:${{ github.sha }}

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@v2

      - name: Install GKE authentication plugin
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Connect to GKE
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          gcloud container clusters get-credentials \
            "${{ vars.GKE_CLUSTER }}" \
            --region "${{ vars.GKE_LOCATION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}"

      - name: Apply Kubernetes manifests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: kubectl apply -f k8s/

      - name: Deploy the new image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          kubectl set image deployment/ci-cd-app \
            ci-cd-app=${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-app:${{ github.sha }}
          kubectl rollout status deployment/ci-cd-app --timeout=180s
          kubectl get pods
